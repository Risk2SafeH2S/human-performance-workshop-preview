fac:["Technician: rule-based mistake (the flange that looked right), with conditions of identical flanges, painted-over tag, first night, different convention, no walk-down with the issuing authority. Supervisor: a deliberate under-reporting decision, a violation shaped by the bonus scheme and the fear of a reaction like the one the plant manager showed. Plant manager: a blame response that confirms the supervisor's fear and guarantees the next event will not be reported.","Just culture: the technician's action would likely have been repeated by another competent person in his position, so the response is to fix the conditions and coach, not remove. The supervisor's suppression is a different category; it needs accountability, and it also needs the incentive that produced it to be removed. Groups should notice that the bonus scheme is the plant's own latent condition.","Recommendations in order: a physical point-of-work identification for every isolation (tag-out at the flange, witnessed walk-down), restoration of tags after coating as a hold point in the coating procedure, a site induction that covers tagging conventions for transferring staff, removal of recordable-rate bonuses in favour of reporting and close-out measures, and a visible change in how the plant manager responds to reported events.","The toolbox talk should thank the operator who reported, state that the technician stays, explain what will change on the plant, and say plainly that under-reporting is the behaviour the plant will act on."]}}
];

/* ---------- PREVIEW EDITION ---------- */
const KEEP=new Set(["c1","c3","c8"]);
const TEASER=CH.filter(c=>!KEEP.has(c.id)).map(c=>({n:c.n,t:c.t}));
CH.splice(0,CH.length,...CH.filter(c=>KEEP.has(c.id)));
CH.forEach(c=>{delete c.ex.fac;});
const INTRO={title:"How this workshop works",body:`
<p class="lede">A facilitated human performance course for operations, maintenance, engineering and HSE teams in the energy sector. The full course has ten chapters, each with a learning section and a group exercise set on a Gulf-region facility. This preview opens three of them.</p>
<div class="grid3" style="margin-top:22px">
<div class="card"><h4>1 Learn together</h4><p>The instructor presents the chapter, or groups read it on their own devices. Sorting and reveal interactions check understanding as you go.</p></div>
<div class="card"><h4>2 Work the exercise in your group</h4><p>Each chapter ends with a scenario and four structured questions. The group discusses, agrees and types its answers.</p></div>
<div class="card"><h4>3 Submit to the instructor</h4><p>In the full course, submissions go to the instructor only. The application does not grade them. The instructor reviews every group's work and leads the debrief, explaining where each group can improve. In this preview, use <b>Copy for instructor</b> to see the submission format.</p></div></div>
<div class="callout" style="margin-top:22px"><h4>Sources</h4><p>The content follows the Energy Institute human performance learning resource, HSE HSG48 <i>Reducing error and influencing behaviour</i>, the EI/CIEHF tools to support situation awareness, and POST note 156 on managing human error. Exercises are composite scenarios; no real company or event is described.</p></div>
<h2 style="margin-top:28px">Suggested timetable</h2>
<div class="tbl"><table><thead><tr><th>Block</th><th>Chapters</th><th>Time</th></tr></thead><tbody>
<tr><td>Day 1 morning</td><td>1 What human performance is · 2 Understanding human failure · 3 Performance shaping factors</td><td>3 h 45 min</td></tr>
<tr><td>Day 1 afternoon</td><td>4 Work-as-imagined and work-as-done · 5 Critical tasks and TIP</td><td>3 h</td></tr>
<tr><td>Day 2 morning</td><td>6 HF in design · 7 Workload, stress and fatigue · 8 Situation awareness</td><td>3 h 45 min</td></tr>
<tr><td>Day 2 afternoon</td><td>9 Procedures and communication · 10 Culture, leadership and learning · course debrief</td><td>3 h</td></tr></tbody></table></div>
<p class="note">Each chapter is about 25 minutes of teaching, 35 to 45 minutes of group work and 15 minutes of debrief. A one-day version uses chapters 1, 2, 3, 5, 8 and 10.</p>`};

/* =====================================================================
   STATE
   ===================================================================== */
const KEY="hp-workshop-preview-v1";
let L={pos:"intro",tab:"learn",group:null,members:"",draft:{},status:{},sort:{},insView:false,insSel:null};
try{const r=localStorage.getItem(KEY);if(r)L=Object.assign(L,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(L));}catch(e){}};
let CAP={db:null,user:null,uid:null,canEdit:false,ready:false};
let SESSION=null;           // sessions/current
let SUBS=new Map();         // instructor: uid -> doc
let REVIEW=new Map();       // instructor: uid -> review doc
let mySub=null;             // trainee: own submissions doc
let unsubs=[];

const $=s=>document.querySelector(s);
const el=(t,a={},h)=>{const e=document.createElement(t);for(const k in a){if(k==="class")e.className=a[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),a[k]);else e.setAttribute(k,a[k]);}if(h!==undefined)e.innerHTML=h;return e;};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=iso=>{try{return new Date(iso).toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"});}catch(e){return iso;}};
function toast(m){const t=el("div",{class:"toast",role:"status"},esc(m));document.body.appendChild(t);setTimeout(()=>t.remove(),3200);}

/* =====================================================================
   CAPABILITIES
   ===================================================================== */
async function boot(){
  render();
  try{
    CAP.db=null;CAP.user=null;
  }catch(e){}
  CAP.ready=true;
  if(CAP.db){
    unsubs.push(CAP.db.doc("sessions/current").onSnapshot(s=>{SESSION=s.exists?s.data():null;render();},()=>{}));
    if(CAP.uid){
      unsubs.push(CAP.db.doc("submissions/"+CAP.uid).onSnapshot(s=>{mySub=s.exists?s.data():null;if(mySub){for(const k in (mySub.entries||{})){L.status[k]=mySub.entries[k].status||"submitted";}save();}render();},()=>{}));
    }
    if(CAP.canEdit){
      unsubs.push(CAP.db.collection("submissions").onSnapshot(q=>{SUBS=new Map(q.docs.map(d=>[d.id,d.data()]));render();},()=>{}));
      unsubs.push(CAP.db.collection("review").onSnapshot(q=>{REVIEW=new Map(q.docs.map(d=>[d.id,d.data()]));render();},()=>{}));
    }
  }
  render();
}
function groups(){return (SESSION&&SESSION.groups)||[];}
function statusOf(id){const e=mySub&&mySub.entries&&mySub.entries[id];if(e)return REVIEW.get(CAP.uid)?.[id]?"discussed":"submitted";if(L.status[id]==="submitted")return "submitted";const d=L.draft[id];return d&&Object.values(d).some(v=>v&&v.trim())?"draft":"";}

/* =====================================================================
   RENDER
   ===================================================================== */
function render(){
  const ins=CAP.canEdit&&L.insView;
  $("#insBtn").hidden=true;L.insView=false;$("#insBtn").classList.toggle("on",ins);$("#insBtn").textContent=ins?"Back to course":"Instructor";
  const chip=$("#modeChip");
  if(!CAP.ready){chip.textContent="Connecting…";chip.className="chip";}
  else if(ins){chip.textContent="Instructor view";chip.className="chip or";}
  else if(L.group){chip.textContent=L.group;chip.className="chip gd";}
  else{chip.textContent="3 of 10 chapters open";chip.className="chip";}
  renderRail();renderPanel();
  const m=$("#main");m.innerHTML="";
  if(ins)renderInstructor(m);
  else if(L.pos==="intro")renderIntro(m);
  else if(L.pos==="about")renderAbout(m);
  else renderChapter(m,CH.find(c=>c.id===L.pos)||CH[0]);
}
function go(pos,tab){L.pos=pos;if(tab)L.tab=tab;save();render();window.scrollTo({top:0});$("#rail").classList.remove("open");$("#menuBtn").setAttribute("aria-expanded","false");$("#main").focus({preventScroll:true});}
function renderRail(){
  const r=$("#rail");r.innerHTML="";
  const ins=CAP.canEdit&&L.insView;
  const b=el("button",{class:"ri",onclick:()=>{L.insView=false;go("intro");}},`<span class="n">00</span><span>How this workshop works</span><span></span>`);
  if(!ins&&L.pos==="intro")b.setAttribute("aria-current","page");r.appendChild(b);
  r.appendChild(el("h4",{},"Chapters"));
  CH.forEach(c=>{const st=statusOf(c.id);const x=el("button",{class:"ri",onclick:()=>{L.insView=false;go(c.id,"learn");}},`<span class="n">${c.n.padStart(2,"0")}</span><span>${esc(c.t)}</span><span class="st ${st==="submitted"?"sub":st==="discussed"?"disc":st==="draft"?"draft":""}" title="${st||"not started"}"></span>`);
    if(!ins&&L.pos===c.id)x.setAttribute("aria-current","page");r.appendChild(x);});
  r.appendChild(el("h4",{},"In the full course"));
  TEASER.forEach(t=>{r.appendChild(el("button",{class:"ri",disabled:"",style:"font-style:italic;opacity:.65"},`<span class="n">${t.n.padStart(2,"0")}</span><span>${esc(t.t)}</span><span class="n">full</span>`));});
  const ab=el("button",{class:"ri",onclick:()=>{L.insView=false;go("about");}},`<span class="n">★</span><span>Work with H²S Consultants</span><span></span>`);if(L.pos==="about")ab.setAttribute("aria-current","page");r.appendChild(ab);
  r.appendChild(el("div",{class:"legend"},`<span><i style="border-style:dashed;border-color:var(--orange)"></i>Draft in progress</span><span><i style="background:var(--good);border-color:var(--good)"></i>Submitted to instructor</span><span><i style="background:var(--orange);border-color:var(--orange)"></i>Discussed in debrief</span>`));
}
function renderPanel(){
  const p=$("#panel");p.innerHTML="";
  if(CAP.canEdit&&L.insView){p.appendChild(el("div",{class:"pbox"},`<h4>Instructor</h4><div class="big">${SESSION?esc(SESSION.name):"No session yet"}</div><p class="sm">${SESSION?`${groups().length} groups · ${SUBS.size} device${SUBS.size===1?"":"s"} connected`:"Create a session to open the exercises to groups."}</p>`));return;}
  const g=el("div",{class:"pbox"});
  if(!CAP.db){
    g.innerHTML=`<h4>Your group</h4><div class="field"><label for="gname">Group name</label><input id="gname" placeholder="e.g. Group B" value="${esc(L.group||"")}"></div><div class="field"><label for="gmem">Members</label><input id="gmem" placeholder="Names, comma-separated" value="${esc(L.members)}"></div><p class="sm">In the full course your group is registered to a live session and submissions reach the instructor directly. In this preview, <b>Copy for instructor</b> shows the submission format.</p>`;
    g.querySelector("#gname").onchange=e=>{L.group=e.target.value.trim()||null;save();render();};g.querySelector("#gmem").onchange=e=>{L.members=e.target.value;save();};
  }else if(!SESSION){
    g.innerHTML=`<h4>Your group</h4><p class="sm">The instructor has not opened a session yet. Exercises can be drafted now and submitted once the session is open.</p>`;
  }else{
    const opts=groups().map(x=>`<option value="${esc(x.name)}"${L.group===x.name?" selected":""}>${esc(x.name)}</option>`).join("");
    g.innerHTML=`<h4>Session</h4><div class="big">${esc(SESSION.name)}</div><div class="field" style="margin-top:10px"><label for="gsel">Your group</label><select id="gsel"><option value="">Select…</option>${opts}</select></div><div class="field"><label for="gmem">Members on this device</label><input id="gmem" placeholder="Names, comma-separated" value="${esc(L.members)}"></div><p class="sm">One device per group is enough. Submissions are visible to the instructor only.</p>`;
    g.querySelector("#gsel").onchange=e=>{L.group=e.target.value||null;save();pushProfile();render();};g.querySelector("#gmem").onchange=e=>{L.members=e.target.value;save();pushProfile();};
  }
  p.appendChild(g);
  const n=CH.filter(c=>["submitted","discussed"].includes(statusOf(c.id))).length;
  p.appendChild(el("div",{class:"pbox"},`<h4>Progress</h4><div class="big">${n} of ${CH.length} exercises submitted</div><p class="sm">Drafts are saved on this device as you type.</p>`));
}
async function pushProfile(){if(!CAP.db||!CAP.uid||!L.group)return;try{const ref=CAP.db.doc("submissions/"+CAP.uid);const s=await ref.get();const base=s.exists?s.data():{entries:{}};await ref.set(Object.assign({},base,{group:L.group,members:L.members,updatedAt:new Date().toISOString()}));}catch(e){}}

function renderAbout(m){
  m.innerHTML=`<div class="eyebrow">About this course</div><h1>Bring the full workshop to your site</h1>
  <div class="prose"><p class="lede">The full Human Performance Workshop has ten chapters, ten Gulf-region group exercises, a live session mode in which every group submits to the instructor's dashboard, and facilitator notes for each exercise.</p>
  <div class="grid2" style="margin-top:22px"><div class="card"><h4>What the full course adds</h4><p>Chapters on human failure types, work-as-imagined and work-as-done, critical tasks and the Task Improvement Process, human factors in design, workload and fatigue, procedures and communication, and culture, leadership and learning from incidents.</p></div>
  <div class="card"><h4>How it is delivered</h4><p>Two days on site or online, in groups of four to six. The instructor presents each chapter, groups work the exercise, submit it, and the instructor leads the debrief from every group's own answers.</p></div>
  <div class="card"><h4>Tailored to your operation</h4><p>Exercises can be rewritten around your own facilities, procedures and incident learnings, so the discussion is about your plant rather than a composite one.</p></div>
  <div class="card"><h4>Also available</h4><p>Human Factors Engineering in Projects and Design, an interactive narrated course; human factors design reviews; incident investigation systems; and the Risk2Safe process safety tool suite.</p></div></div>
  <div class="callout or" style="margin-top:22px"><h4>H²S Consultants · Risk2Safe</h4><p>Human factors, process safety and HSE consulting for oil and gas, grounded in Energy Institute, IOGP and HSE guidance and 30 years of operator-side experience in the Gulf.</p><p style="margin:0"><b>info@risk2safe.com</b> · +91 90031 46969 · <a href="https://risk2safe.com" target="_blank" rel="noopener">risk2safe.com</a> · <a href="https://app.risk2safe.com" target="_blank" rel="noopener">app.risk2safe.com</a></p></div></div>`;
}
function renderIntro(m){
  m.innerHTML=`<div class="eyebrow">Human performance · facilitated course</div><h1>${INTRO.title}</h1><div class="hero">${ART.cover}</div><div class="prose">${INTRO.body}</div>`;
  m.appendChild(el("div",{style:"margin-top:20px"})).appendChild(el("button",{class:"btn",onclick:()=>go("c1","learn")},"Start Chapter 1 →"));
}
function renderChapter(m,c){
  const st=statusOf(c.id);
  m.innerHTML=`<div class="eyebrow">Chapter ${c.n} of ${CH.length}</div><h1>${esc(c.t)}</h1>${ART[c.id]?`<div class="hero">${ART[c.id]}</div>`:""}<div class="obj"><b>Learning objective</b><p>${esc(c.obj)}</p></div>`;
  const tabs=el("div",{class:"tabs",role:"tablist"});
  [["learn","Learn"],["ex","Group exercise"]].forEach(([k,lbl])=>{const b=el("button",{class:"tab",role:"tab","aria-selected":L.tab===k?"true":"false",onclick:()=>{L.tab=k;save();render();}},lbl+(k==="ex"&&st?`<span class="cnt">${st}</span>`:""));tabs.appendChild(b);});
  m.appendChild(tabs);
  if(L.tab==="learn"){
    const d=el("div",{class:"prose"},c.learn);m.appendChild(d);wireLearn(d,c.id);
    const row=el("div",{class:"status",style:"margin-top:24px;border:1px solid var(--line);border-radius:10px"});
    row.append(el("button",{class:"btn",onclick:()=>{L.tab="ex";save();render();window.scrollTo({top:0});}},"Go to the group exercise →"));
    const i=CH.indexOf(c);if(i>0)row.append(el("button",{class:"btn gh",onclick:()=>go(CH[i-1].id,"learn")},"← Previous chapter"));
    m.appendChild(row);
  }else renderExercise(m,c);
}
function wireLearn(root,cid){
  root.querySelectorAll(".rev>button").forEach(b=>b.onclick=()=>b.parentElement.classList.toggle("open"));
  root.querySelectorAll(".sortq").forEach((box,bi)=>{
    const items=JSON.parse(box.dataset.sort),opts=JSON.parse(box.dataset.opts);const key=cid+"-"+bi;L.sort[key]=L.sort[key]||{};
    items.forEach(([txt,ans],i)=>{const it=el("div",{class:"it"});it.appendChild(el("span",{},esc(txt)));const o=el("div",{class:"opts"});
      opts.forEach(op=>{const b=el("button",{type:"button"},op);const paint=()=>{const v=L.sort[key][i];b.classList.toggle("sel",v===op);it.classList.toggle("ok",v!==undefined&&v===ans);it.classList.toggle("no",v!==undefined&&v!==ans);};b.onclick=()=>{L.sort[key][i]=op;save();o.querySelectorAll("button").forEach(x=>x.dispatchEvent(new Event("paint")));};b.addEventListener("paint",paint);paint();o.appendChild(b);});
      it.appendChild(o);box.appendChild(it);});
    box.appendChild(el("p",{class:"fb"},"Choose an answer for each line. Green means it matches the source classification; red means look again."));
  });
}
function renderExercise(m,c){
  const E=c.ex,st=statusOf(c.id),locked=st==="submitted"||st==="discussed";
  const d=L.draft[c.id]||(L.draft[c.id]={});
  const box=el("section",{class:"ex"});
  box.innerHTML=`<div class="ex-h"><span class="k">Group exercise ${c.n}</span><h3>${esc(E.title)}</h3><span class="time">${esc(E.time)} · discuss, agree, then type</span></div>`;
  const b=el("div",{class:"ex-b"});
  b.appendChild(el("div",{class:"scn"},`<h4>Scenario</h4>${ART[c.id]?`<div class="hero sm">${ART[c.id]}</div>`:""}${E.scn}<div style="clear:both"></div>`));
  const sub=mySub&&mySub.entries&&mySub.entries[c.id];
  E.qs.forEach((q,i)=>{const w=el("div",{class:"q"});w.appendChild(el("label",{for:`${c.id}-q${i}`},esc(q.l)));w.appendChild(el("p",{class:"hint"},esc(q.h)));
    if(locked){w.appendChild(el("div",{class:"ans"},esc((sub&&sub.answers&&sub.answers[i])||d[i]||"(no answer)")));}
    else{const ta=el("textarea",{id:`${c.id}-q${i}`});ta.value=d[i]||"";ta.oninput=()=>{d[i]=ta.value;save();renderRail();};w.appendChild(ta);}
    b.appendChild(w);});
  box.appendChild(b);
  const row=el("div",{class:"status"});
  if(locked){
    row.appendChild(el("span",{class:"pill "+(st==="discussed"?"disc":"sub")},st==="discussed"?"Discussed with the instructor":"Submitted to the instructor"));
    if(sub&&sub.submittedAt)row.appendChild(el("span",{class:"note"},`Sent ${fmt(sub.submittedAt)} by ${esc(sub.group||L.group||"your group")}`));
    row.appendChild(el("button",{class:"btn gh",onclick:()=>copySub(c)},"Copy submission"));
    if(st!=="discussed")row.appendChild(el("button",{class:"btn gh",onclick:()=>{L.status[c.id]="";save();render();}},"Reopen and edit"));
  }else{
    const filled=E.qs.filter((q,i)=>(d[i]||"").trim().length>=20).length;
    const canSend=filled===E.qs.length&&!!L.group;
    const sb=el("button",{class:"btn",onclick:()=>submit(c)},"Submit to instructor");sb.disabled=!canSend;
    row.appendChild(sb);
    row.appendChild(el("button",{class:"btn gh",onclick:()=>copySub(c)},"Copy for instructor"));
    row.appendChild(el("span",{class:"note"},!L.group?"Select your group in the panel first.":filled<E.qs.length?`${filled} of ${E.qs.length} answers written.`:(CAP.db&&SESSION?"Ready to submit.":"No live session: use Copy for instructor.")));
  }
  box.appendChild(row);
  m.appendChild(box);
  const i=CH.indexOf(c);const nav=el("div",{class:"row",style:"display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"});
  nav.appendChild(el("button",{class:"btn gh",onclick:()=>{L.tab="learn";save();render();window.scrollTo({top:0});}},"← Back to the lesson"));
  if(i<CH.length-1)nav.appendChild(el("button",{class:"btn sec",onclick:()=>go(CH[i+1].id,"learn")},`Next: Chapter ${CH[i+1].n} →`));
  else nav.appendChild(el("button",{class:"btn sec",onclick:()=>go("about")},"Bring the full workshop to your site →"));
  m.appendChild(nav);
}
function subText(c){const d=L.draft[c.id]||{};return `HUMAN PERFORMANCE WORKSHOP · Exercise ${c.n}: ${c.ex.title}\nGroup: ${L.group||"-"}\nMembers: ${L.members||"-"}\nTime: ${new Date().toLocaleString()}\n\n`+c.ex.qs.map((q,i)=>`${q.l}\n${(d[i]||"").trim()||"(no answer)"}\n`).join("\n");}
async function copySub(c){const t=subText(c);try{await navigator.clipboard.writeText(t);toast("Copied. Paste it into a message to the instructor.");}catch(e){const ta=el("textarea",{style:"position:fixed;left:-9999px"});ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Copied.");}catch(e2){toast("Copy failed. Select the text manually.");}ta.remove();}}
async function submit(c){
  const d=L.draft[c.id]||{};const entry={answers:c.ex.qs.map((q,i)=>(d[i]||"").trim()),submittedAt:new Date().toISOString(),group:L.group,status:"submitted"};
  if(CAP.db&&CAP.uid&&SESSION){
    try{const ref=CAP.db.doc("submissions/"+CAP.uid);const s=await ref.get();const base=s.exists?s.data():{};const entries=Object.assign({},base.entries||{});entries[c.id]=entry;
      await ref.set({group:L.group,members:L.members,updatedAt:entry.submittedAt,entries});L.status[c.id]="submitted";save();toast("Submitted. Only the instructor can see it.");render();return;}
    catch(e){toast("Could not reach the session. Use Copy for instructor.");}
  }else{L.status[c.id]="submitted";save();toast("In the full course this would now reach the instructor's dashboard.");render();await copySub(c);}
}

/* =====================================================================
   INSTRUCTOR
   ===================================================================== */
function renderInstructor(m){
  m.className="ins";
  m.innerHTML=`<div class="eyebrow">Instructor only</div><h1>Session and submissions</h1>`;
  if(!CAP.db){m.appendChild(el("div",{class:"warn"},"This page is not connected to a shared session store, so groups will send their work by copied text. Facilitator notes for every exercise are still available below."));}
  else{
    const s=el("div",{class:"subview"});
    if(!SESSION){s.innerHTML=`<h3 style="font-size:18px">Open a session</h3><p class="note">Give the session a name and the number of groups. Trainees then pick their group on their own device.</p><div class="grid2"><div class="field"><label for="sname">Session name</label><input id="sname" placeholder="e.g. Site A · Human performance · 12 Nov"></div><div class="field"><label for="sn">Number of groups</label><input id="sn" type="number" min="1" max="12" value="4"></div></div>`;
      s.appendChild(el("button",{class:"btn",onclick:async()=>{const name=s.querySelector("#sname").value.trim()||"Human performance workshop";const n=Math.max(1,Math.min(12,+s.querySelector("#sn").value||4));const gs=Array.from({length:n},(_,i)=>({id:"g"+(i+1),name:"Group "+String.fromCharCode(65+i)}));try{await CAP.db.doc("sessions/current").set({name,groups:gs,createdAt:new Date().toISOString(),open:true});toast("Session opened.");}catch(e){toast("Could not open the session.");}}},"Open session"));}
    else{
      s.innerHTML=`<h3 style="font-size:18px">${esc(SESSION.name)}</h3><p class="note">Opened ${fmt(SESSION.createdAt)} · ${groups().length} groups</p>`;
      const gl=el("div",{class:"grp-list"});groups().forEach(g=>{const devs=[...SUBS.values()].filter(x=>x.group===g.name);gl.appendChild(el("div",{class:"grp"},`<span><b>${esc(g.name)}</b><span class="sm"> · ${devs.length?devs.map(x=>esc(x.members||"members not entered")).join(" / "):"no device yet"}</span></span><span class="sm">${devs.reduce((a,x)=>a+Object.keys(x.entries||{}).length,0)} submissions</span>`));});
      s.appendChild(gl);
      const row=el("div",{class:"status",style:"margin:14px -20px -18px;border-radius:0 0 12px 12px"});
      row.appendChild(el("button",{class:"btn gh",onclick:async()=>{const gs=groups().concat([{id:"g"+(groups().length+1),name:"Group "+String.fromCharCode(65+groups().length)}]);try{await CAP.db.doc("sessions/current").update({groups:gs});}catch(e){toast("Could not add a group.");}}},"Add a group"));
      const cl=el("button",{class:"btn gh"},"Close session");cl.onclick=()=>{row.innerHTML="";row.append(el("span",{class:"note"},"Close the session? Group submissions stay stored; trainees can no longer submit."),el("button",{class:"btn",style:"background:var(--bad)",onclick:async()=>{try{await CAP.db.doc("sessions/current").delete();toast("Session closed.");}catch(e){toast("Could not close.");}}},"Close"),el("button",{class:"btn gh",onclick:render},"Cancel"));};
      row.appendChild(cl);s.appendChild(row);
    }
    m.appendChild(s);
    /* matrix */
    const mx=el("div",{class:"matrix"});
    const rows=[...SUBS.entries()].sort((a,b)=>(a[1].group||"").localeCompare(b[1].group||""));
    mx.innerHTML=`<table><thead><tr><th>Group / device</th>${CH.map(c=>`<th title="${esc(c.t)}">${c.n}</th>`).join("")}</tr></thead><tbody>${rows.length?"":`<tr><td colspan="${CH.length+1}" style="color:var(--muted)">No submissions yet.</td></tr>`}</tbody></table>`;
    const tb=mx.querySelector("tbody");
    rows.forEach(([uid,doc])=>{const tr=el("tr");tr.appendChild(el("td",{},`<b>${esc(doc.group||"No group")}</b><br><span class="note">${esc(doc.members||"")}</span>`));
      CH.forEach(c=>{const e=doc.entries&&doc.entries[c.id];const td=el("td");const disc=REVIEW.get(uid)?.[c.id];
        if(e){const b=el("button",{class:"cell "+(disc?"disc":"sub"),title:(disc?"Discussed · ":"Submitted · ")+fmt(e.submittedAt),onclick:()=>{L.insSel={uid,cid:c.id};save();render();}},disc?"✓":"●");td.appendChild(b);}
        else td.appendChild(el("span",{class:"cell"},"–"));tr.appendChild(td);});
      tb.appendChild(tr);});
    m.appendChild(mx);
    m.appendChild(el("p",{class:"note",style:"margin-top:8px"},"● submitted, awaiting debrief · ✓ marked as discussed. Select a cell to read the group's answers next to the facilitator notes."));
    if(L.insSel&&SUBS.has(L.insSel.uid)){const doc=SUBS.get(L.insSel.uid),c=CH.find(x=>x.id===L.insSel.cid),e=doc.entries&&doc.entries[c.id];
      if(e){const v=el("div",{class:"subview"});v.innerHTML=`<h3 style="font-size:20px">${esc(doc.group||"Group")} · Exercise ${c.n}: ${esc(c.ex.title)}</h3><div class="meta"><span>${esc(doc.members||"")}</span><span>Submitted ${fmt(e.submittedAt)}</span></div>`;
        c.ex.qs.forEach((q,i)=>{const w=el("div",{class:"q"});w.appendChild(el("label",{},esc(q.l)));w.appendChild(el("div",{class:"ans"},esc(e.answers[i]||"(no answer)")));v.appendChild(w);});
        v.appendChild(facNotes(c));
        const disc=REVIEW.get(L.insSel.uid)?.[c.id];
        const row=el("div",{class:"status",style:"margin:16px -20px -18px;border-radius:0 0 12px 12px"});
        row.appendChild(el("button",{class:disc?"btn gh":"btn",onclick:async()=>{try{const ref=CAP.db.doc("review/"+L.insSel.uid);const s=await ref.get();const b=s.exists?s.data():{};b[c.id]=disc?null:{at:new Date().toISOString()};if(!b[c.id])delete b[c.id];await ref.set(b);}catch(err){toast("Could not update.");}}},disc?"Unmark discussed":"Mark as discussed"));
        row.appendChild(el("span",{class:"note"},"Marking tells the group's device that the debrief for this exercise has taken place."));
        row.appendChild(el("button",{class:"btn gh",style:"margin-left:auto",onclick:()=>{L.insSel=null;save();render();}},"Close"));
        v.appendChild(row);m.appendChild(v);}}
  }
  /* facilitator notes for all chapters */
  const all=el("div",{style:"margin-top:30px"});all.appendChild(el("h2",{style:"font-size:22px;margin-bottom:6px"},"Facilitator notes by exercise"));
  all.appendChild(el("p",{class:"note"},"Expected answers, common gaps and debrief prompts. These notes are in the page for the instructor's use; they are not shown in the trainee view."));
  CH.forEach(c=>{const r=el("div",{class:"rev"});r.innerHTML=`<button type="button">Exercise ${c.n}: ${esc(c.ex.title)}</button>`;const b=el("div",{class:"body"});b.appendChild(facNotes(c));r.appendChild(b);r.querySelector("button").onclick=()=>r.classList.toggle("open");all.appendChild(r);});
  m.appendChild(all);
}
function facNotes(c){return el("div",{class:"fac"},`<h4>Facilitator notes</h4><p style="margin:0">Provided with the full course.</p>`);}

/* =====================================================================
   WIRING
   ===================================================================== */
$("#insBtn").onclick=()=>{L.insView=!L.insView;save();render();window.scrollTo({top:0});};
$("#menuBtn").onclick=()=>{const r=$("#rail");const o=!r.classList.contains("open");r.classList.toggle("open",o);$("#menuBtn").setAttribute("aria-expanded",o?"true":"false");};
document.addEventListener("click",e=>{const r=$("#rail");if(r.classList.contains("open")&&!r.contains(e.target)&&e.target.id!=="menuBtn"){r.classList.remove("open");$("#menuBtn").setAttribute("aria-expanded","false");}});
(function(){const st=document.createElement('style');st.textContent=ART_CSS;document.head.appendChild(st);})();
boot();
</script>
